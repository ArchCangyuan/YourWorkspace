name: Build YourWorkspace Android APK

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "android/**"
      - "tools/fetch_rdp_client.sh"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Cache IronRDP build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            .ironrdp-build/target
          key: ironrdp-${{ hashFiles('tools/fetch_rdp_client.sh') }}
          restore-keys: ironrdp-

      - name: Fetch built-in remote desktop client
        run: ./tools/fetch_rdp_client.sh

      - name: Build debug APK
        run: gradle --no-daemon -p android clean assembleDebug

      - name: Verify and stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YourWorkspace.apk
          unzip -t YourWorkspace.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: YourWorkspace.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/$TAG.md"
          # Normally the release already exists (it triggered this run); otherwise
          # whichever platform workflow finishes first creates it.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ -f "$NOTES" ]]; then
              gh release create "$TAG" --verify-tag --title "YourWorkspace $TAG" \
                --notes-file "$NOTES" || true
            else
              gh release create "$TAG" --verify-tag --title "YourWorkspace $TAG" \
                --generate-notes || true
            fi
          fi
          gh release upload "$TAG" YourWorkspace.apk --clobber
