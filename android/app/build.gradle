plugins {
    id "com.android.application"
}

android {
    namespace "net.archcangyuan.codeserverapp"
    compileSdk 36

    defaultConfig {
        applicationId "net.archcangyuan.codeserverapp"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    // A fixed key (from CI secrets) so each build installs over the last one.
    // Without it Gradle signs with a per-machine debug key, and every CI
    // build then needs an uninstall first.
    def keystoreFile = System.getenv("YW_KEYSTORE_FILE")
    signingConfigs {
        if (keystoreFile) {
            fixed {
                storeFile file(keystoreFile)
                storePassword System.getenv("YW_KEYSTORE_PASSWORD")
                keyAlias System.getenv("YW_KEY_ALIAS") ?: "yourworkspace"
                keyPassword System.getenv("YW_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            if (keystoreFile) {
                signingConfig signingConfigs.fixed
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }
}
