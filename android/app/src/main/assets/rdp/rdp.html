<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, minimum-scale=0.1, maximum-scale=5.0, user-scalable=yes">
<title>Remote desktop</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1e1e1e;
    font-family: system-ui, sans-serif;
  }
  iron-remote-desktop {
    display: block;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #status {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    max-width: 80%;
    padding: 14px 20px;
    border-radius: 14px;
    background: rgba(243, 243, 243, 0.92);
    color: #222;
    font-size: 15px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    pointer-events: none;
  }
  #status[hidden] {
    display: none;
  }
  /* Floating at the top, above the remote desktop canvas. */
  #transfers {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: min(440px, calc(100% - 24px));
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .transfer {
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(243, 243, 243, 0.95);
    color: #222;
    font-size: 13px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
  }
  .transfer[hidden] {
    display: none;
  }
  .transfer header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .transfer header span {
    flex: 1;
  }
  .transfer .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .transfer .name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .transfer .state {
    flex: 0 1 auto;
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #666;
    font-size: 12px;
    white-space: nowrap;
  }
  .transfer header span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .transfer button {
    flex: none;
  }
  .transfer button {
    border: 0;
    border-radius: 8px;
    padding: 5px 10px;
    background: #6750a4;
    color: #fff;
    font-size: 12px;
  }
  .transfer button.plain {
    background: transparent;
    color: #444;
    font-size: 15px;
    padding: 2px 6px;
  }
  .transfer .item + .item {
    border-top: 1px solid rgba(0, 0, 0, 0.06);
  }
  .transfer .bar {
    height: 4px;
    margin: 2px 0 6px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }
  .transfer .bar i {
    display: block;
    width: 0;
    height: 100%;
    background: #6750a4;
    transition: width 0.2s;
  }
  .transfer .failed .state {
    max-width: 65%;
    color: #b3261e;
    white-space: normal;
  }
  .transfer .failed .bar i {
    background: #b3261e;
  }
  .transfer [hidden] {
    display: none;
  }
  .transfer button.small {
    font-size: 12px;
  }
  .transfer pre.log {
    max-height: 40vh;
    margin: 0 0 6px;
    padding: 6px;
    overflow: auto;
    border-radius: 6px;
    background: #fff;
    color: #333;
    font-size: 10px;
    white-space: pre-wrap;
    word-break: break-all;
    user-select: text;
    -webkit-user-select: text;
  }
  .transfer button:disabled {
    opacity: 0.5;
  }
  #status small {
    display: block;
    margin-top: 6px;
    color: #666;
    font-size: 12px;
    word-break: break-word;
  }
</style>
</head>
<body>
<div id="status">Connecting…</div>
<div id="transfers" data-your-workspace-ui>
  <div id="downloads" class="transfer" hidden></div>
  <div id="uploads" class="transfer" hidden></div>
</div>
<script>
  // Tells the app's page bridge to leave the viewport alone (see rdp zoom).
  window.__yourWorkspaceRdpPage = true;
</script>
<script type="module">
  const nativeBridge = window.YourWorkspaceRdp || null;
  const sessionToken = decodeURIComponent(location.hash.slice(1));
  const statusElement = document.getElementById('status');

  const showStatus = (text, detail = '') => {
    statusElement.textContent = text;
    if (detail) {
      const small = document.createElement('small');
      small.textContent = detail;
      statusElement.appendChild(small);
    }
    statusElement.hidden = !text;
  };
  // Where the gateway got to on the latest attempt: {stage, error}.
  const gatewayStatus = () => {
    try {
      return JSON.parse(nativeBridge ? nativeBridge.gatewayStatus(sessionToken) : '{}');
    } catch (_) {
      return {};
    }
  };
  const shortReason = (text) => String(text || '')
    .replace(/\[[^\]]*@ [^\]]*\]\s*/g, '')
    .slice(0, 160);
  const notifyNative = (event, detail = '') => {
    try {
      nativeBridge?.onSessionEvent(sessionToken, event, String(detail));
    } catch (_) {}
  };

  // IronRDP synchronizes the clipboard through navigator.clipboard, which a
  // WebView cannot read. Back it with the Android clipboard instead.
  if (nativeBridge) {
    // IronRDP polls the local clipboard; a change means it was replaced
    // (copied on the phone, or text copied on the PC arrived).
    let lastClipboardText = null;
    const readText = async () => {
      const read = nativeBridge.clipboardText();
      // null: the clipboard cannot be read right now (the app is in the
      // background); keep reporting the last content so nothing looks copied.
      if (read === null || read === undefined) {
        // Nothing known yet: fail the read (IronRDP skips it) rather than
        // report an empty clipboard.
        if (lastClipboardText === null) throw new Error('clipboard not readable yet');
        return lastClipboardText;
      }
      const text = read;
      if (lastClipboardText !== null && text !== lastClipboardText) {
        console.info(`clipboard: phone clipboard changed (${text.length} chars)`);
        window.dispatchEvent(new Event('yourworkspace-clipboard-replaced'));
      }
      lastClipboardText = text;
      return text;
    };
    const textType = (types) => types.find((type) => type.startsWith('text/plain'))
      || types.find((type) => type.startsWith('text/'));
    const writeText = async (text) => nativeBridge.setClipboardText(String(text ?? ''));
    const clipboard = {
      readText,
      writeText,
      async read() {
        const text = await readText();
        return [new ClipboardItem({ 'text/plain': new Blob([text], { type: 'text/plain' }) })];
      },
      async write(items) {
        for (const item of items) {
          const type = textType(item.types);
          if (type) {
            await writeText(await (await item.getType(type)).text());
            return;
          }
        }
      }
    };
    Object.defineProperty(navigator, 'clipboard', { configurable: true, get: () => clipboard });
    // The WebView reports clipboard permissions as denied, which would make
    // IronRDP fall back to manual, text-only clipboard handling.
    const permissions = navigator.permissions;
    if (permissions?.query) {
      const query = permissions.query.bind(permissions);
      permissions.query = (descriptor) => String(descriptor?.name || '').startsWith('clipboard')
        ? Promise.resolve({ state: 'granted', name: descriptor.name, onchange: null })
        : query(descriptor);
    }
  }

  const config = JSON.parse(
    nativeBridge ? nativeBridge.config(sessionToken) : (window.__rdpTestConfig || '{}')
  );

  const { init, Backend, displayControl, enableCredssp, RdpFileTransferProvider } =
    await import('./iron-remote-desktop-rdp.js');
  await import('./iron-remote-desktop.js');
  await init('DEBUG');

  // The page stays at scale 1, so CSS pixels map to the WebView at all
  // times. The app's zoom sets the desktop's pixel density instead (see
  // desktopScale); a changing page scale would make the size unreliable.
  const viewportMeta = document.querySelector('meta[name="viewport"]');
  const FIXED_VIEWPORT =
    'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no';
  const lockViewport = () => {
    if (viewportMeta.getAttribute('content') !== FIXED_VIEWPORT) {
      viewportMeta.setAttribute('content', FIXED_VIEWPORT);
    }
  };
  lockViewport();
  new MutationObserver(lockViewport).observe(viewportMeta, { attributes: true });

  // The space the desktop has on screen, in CSS pixels.
  const availableSize = () => ({
    width: Math.max(1, document.documentElement.clientWidth),
    height: Math.max(1, document.documentElement.clientHeight)
  });
  // Desktop pixels per CSS pixel. The app's zoom gives a layout width for
  // the screen's long side (1280 at 100%), so rotating keeps the density.
  const desktopScale = () => {
    const zoomWidth = Number(window.__codeServerAppViewportWidth) || 1280;
    return zoomWidth / Math.max(screen.width, screen.height, 1);
  };
  // Largest size the server has shown it accepts; Windows caps the desktop
  // (e.g. 4096 x 2048 without the graphics pipeline) and a capped dimension
  // would leave black bars. Learned from what the server actually applies.
  const serverLimit = { width: Infinity, height: Infinity };
  // The desktop size to request: the available space at the zoom's density,
  // kept within the server's limit with the same aspect ratio.
  const desktopSize = (available = availableSize()) => {
    let width = available.width * desktopScale();
    let height = available.height * desktopScale();
    const grow = Math.max(1, 200 / width, 200 / height);
    width *= grow;
    height *= grow;
    const shrink = Math.min(1, serverLimit.width / width, serverLimit.height / height);
    return {
      width: Math.max(200, Math.floor(width * shrink / 2) * 2),
      height: Math.max(200, Math.floor(height * shrink))
    };
  };

  const element = document.createElement('iron-remote-desktop');
  element.setAttribute('scale', 'fit');
  element.setAttribute('flexcenter', 'false');
  element.module = Backend;

  let ui = null;
  let connected = false;
  let attempts = 0;
  let connectedSize = null;
  let checkTimer = 0;
  // One resize at a time: changes while the server is still resizing only
  // mark the area as changed, and the latest size follows once it is done.
  let resizeInFlight = false;
  let changedWhileInFlight = false;

  const rendererCanvas = () => element.shadowRoot?.querySelector('canvas') || null;

  // The page scales the desktop itself: it fills the available area once the
  // server applies a size, and keeps its scale (anchored top left) while a
  // resize is pending instead of shrinking the old frame to fit.
  const fitDisplay = () => {
    const canvas = rendererCanvas();
    if (!canvas || !canvas.width || !canvas.height) return;
    const available = availableSize();
    const scale = Math.max(canvas.width / available.width, canvas.height / available.height);
    element.style.setProperty('--rdp-width', `${canvas.width / scale}px`);
    element.style.setProperty('--rdp-height', `${canvas.height / scale}px`);
  };
  const takeOverScaling = () => {
    const root = element.shadowRoot;
    const canvas = rendererCanvas();
    if (!root || !canvas || root.getElementById('your-workspace-scaling')) return;
    const style = document.createElement('style');
    style.id = 'your-workspace-scaling';
    style.textContent = `.screen-viewer {
      width: var(--rdp-width, 100%) !important;
      height: var(--rdp-height, 100%) !important;
      min-width: 0 !important; min-height: 0 !important;
      max-width: none !important; max-height: none !important;
    }`;
    root.appendChild(style);
    new MutationObserver(fitDisplay).observe(canvas, { attributes: true, attributeFilter: ['width', 'height'] });
    fitDisplay();
  };

  const requestSize = (size) => {
    connectedSize = size;
    resizeInFlight = true;
    try {
      ui.resize(size.width, size.height);
    } catch (_) {
      resizeInFlight = false;
      fitDisplay();
      return;
    }
    checkAppliedSize(size);
  };

  const resizeSettled = () => {
    resizeInFlight = false;
    if (changedWhileInFlight) {
      changedWhileInFlight = false;
      syncDesktopSize();
    }
  };

  // After the server applies a size, learn its limit when it shrank a
  // dimension, and ask again for a size with the right aspect ratio. When
  // the server does not follow, fit what it sends.
  const checkAppliedSize = (requested, retries = 2, atConnect = false, resends = 3) => {
    window.clearTimeout(checkTimer);
    const started = Date.now();
    // At connect the canvas already has the server's choice.
    const initial = atConnect ? null : rendererCanvas();
    const before = initial ? { width: initial.width, height: initial.height } : null;
    const poll = () => {
      if (!connected) {
        resizeInFlight = false;
        return;
      }
      if (connectedSize !== requested) return;
      const canvas = rendererCanvas();
      const applied = canvas ? { width: canvas.width, height: canvas.height } : null;
      const matches = applied
        && Math.abs(applied.width - requested.width) <= 2
        && Math.abs(applied.height - requested.height) <= 2;
      if (matches) {
        fitDisplay();
        resizeSettled();
        return;
      }
      // The server answered with another size (e.g. capped): act on it now.
      // Otherwise wait for it, up to 2.5 s.
      const responded = applied
        && (!before || applied.width !== before.width || applied.height !== before.height);
      if (!responded && Date.now() - started < 2500) {
        checkTimer = window.setTimeout(poll, 100);
        return;
      }
      fitDisplay();
      if (!responded && resends > 0) {
        // Windows drops a resize that arrives while it is still applying one:
        // ask again for the current size instead of staying at a stale one.
        const size = desktopSize();
        connectedSize = size;
        try {
          ui.resize(size.width, size.height);
        } catch (_) {
          resizeSettled();
          return;
        }
        checkAppliedSize(size, retries, false, resends - 1);
        return;
      }
      if (!applied || retries <= 0 || !responded) {
        // A server that ignored the request tells nothing about its limit.
        resizeSettled();
        return;
      }
      let learned = false;
      if (applied.width < requested.width - 16 && applied.width < serverLimit.width) {
        serverLimit.width = applied.width;
        learned = true;
      }
      if (applied.height < requested.height - 16 && applied.height < serverLimit.height) {
        serverLimit.height = applied.height;
        learned = true;
      }
      if (!learned) {
        resizeSettled();
        return;
      }
      const size = desktopSize();
      if (Math.abs(size.width - applied.width) < 4 && Math.abs(size.height - applied.height) < 4) {
        resizeSettled();
        return;
      }
      connectedSize = size;
      try {
        ui.resize(size.width, size.height);
      } catch (_) {
        resizeSettled();
        return;
      }
      checkAppliedSize(size, retries - 1);
    };
    checkTimer = window.setTimeout(poll, 100);
  };

  const errorKindNames = [
    'General', 'WrongPassword', 'LogonFailure', 'AccessDenied',
    'RDCleanPath', 'ProxyConnect', 'NegotiationFailure'
  ];

  const describeError = (error) => {
    if (error && typeof error.kind === 'function') {
      const kind = errorKindNames[error.kind()] || 'General';
      let detail = '';
      try {
        detail = error.backtrace();
      } catch (_) {}
      const status = error.rdcleanpathDetails?.()?.httpStatusCode;
      return { kind, detail, status };
    }
    return { kind: 'General', detail: String(error?.message || error), status: undefined };
  };

  const scheduleReconnect = (reason) => {
    let gatewayState = '';
    try { gatewayState = JSON.stringify(gatewayStatus()); } catch (_) {}
    console.warn('rdp disconnected:', typeof reason === 'string' ? reason : JSON.stringify(reason), gatewayState);
    connected = false;
    resizeInFlight = false;
    changedWhileInFlight = false;
    attempts += 1;
    if (attempts > 5) {
      showStatus('Disconnected. Tap Reload to try again.', shortReason(reason));
      notifyNative('failed', shortReason(reason));
      return;
    }
    const delay = Math.min(10000, 1000 * attempts);
    showStatus(`Reconnecting… (${attempts}/5)`, shortReason(reason));
    notifyNative('reconnecting', reason);
    setTimeout(connect, delay);
  };

  // NLA (CredSSP/NTLM) in IronRDP splits an e-mail user name into user and
  // domain ("name" + "outlook.com"), which a PC signed in with a Microsoft
  // account rejects. Such names get one retry without NLA, where Windows
  // receives the full name in the logon information.
  const username = config.username || '';
  const emailUsername = username.includes('@') && !username.includes('\\') && !config.domain;
  let withoutNla = false;

  async function connect() {
    if (!attempts) showStatus('Connecting…');
    const size = desktopSize();
    const builder = ui.configBuilder()
      .withUsername(config.username || '')
      .withPassword(config.password || '')
      .withDestination(config.destination)
      .withProxyAddress(config.proxyAddress)
      .withAuthToken(sessionToken)
      .withDesktopSize(size)
      .withExtension(displayControl(true));
    if (config.domain) builder.withServerDomain(config.domain);
    if (withoutNla) builder.withExtension(enableCredssp(false));
    let session;
    try {
      session = await ui.connect(builder.build());
    } catch (error) {
      const { kind, detail, status } = describeError(error);
      const gateway = gatewayStatus();
      const signInFailed = kind === 'WrongPassword' || kind === 'LogonFailure'
        || (gateway.stage === 'relay' && kind === 'General');
      if (emailUsername && !withoutNla && signInFailed) {
        withoutNla = true;
        showStatus('Signing in with the full e-mail user name…');
        connect();
        return;
      }
      if (withoutNla && kind === 'NegotiationFailure') {
        withoutNla = false;
        const message = 'This PC requires Network Level Authentication, which cannot send '
          + 'an e-mail user name here. Use the PC\'s local account name instead '
          + '(run whoami on the PC).';
        showStatus('Windows sign-in failed.', message);
        notifyNative('sign_in_failed', message);
        return;
      }
      if (kind === 'WrongPassword' || kind === 'LogonFailure' || kind === 'AccessDenied') {
        showStatus('Windows rejected the user name or password.');
        notifyNative('credentials_rejected', kind);
        return;
      }
      if (status === 401) {
        showStatus('Cloudflare sign-in expired.');
        notifyNative('login_required');
        return;
      }
      if (gateway.stage === 'relay' && kind === 'General') {
        // TLS to the PC worked but the connection ended during CredSSP/NLA:
        // almost always a rejected sign-in. Retrying could lock the account.
        showStatus('Windows sign-in failed.', shortReason(detail));
        notifyNative('sign_in_failed', shortReason(detail));
        return;
      }
      scheduleReconnect(gateway.error || `${kind}: ${detail}`);
      return;
    }
    connected = true;
    attempts = 0;
    connectedSize = size;
    ui.setVisibility(true);
    takeOverScaling();
    checkAppliedSize(size, 2, true);
    showStatus('');
    notifyNative('connected');
    try {
      const termination = await session.run();
      scheduleReconnect(termination.reason());
    } catch (error) {
      scheduleReconnect(describeError(error).detail);
    }
  }

  // Follow every change of the available area (rotation, keyboard, address
  // bar) and of the app's zoom with a dynamic resize instead of a reconnect.
  // The first change is sent right away; see resizeInFlight for the rest.
  function syncDesktopSize() {
    if (!connected || !ui || !connectedSize) return;
    const size = desktopSize();
    if (Math.abs(size.width - connectedSize.width) < 8
        && Math.abs(size.height - connectedSize.height) < 8) {
      if (!resizeInFlight) fitDisplay();
      return;
    }
    if (resizeInFlight) {
      changedWhileInFlight = true;
      return;
    }
    requestSize(size);
  }
  let areaFrame = 0;
  const onAreaChanged = () => {
    // Coalesce the events of one layout change (resize, visual viewport,
    // resize observer) into a single check on the next frame.
    if (areaFrame) return;
    areaFrame = window.requestAnimationFrame(() => {
      areaFrame = 0;
      syncDesktopSize();
    });
  };
  window.addEventListener('resize', onAreaChanged);
  window.visualViewport?.addEventListener('resize', onAreaChanged);
  new ResizeObserver(onAreaChanged).observe(document.documentElement);
  window.addEventListener('yourworkspace-rdp-zoom', onAreaChanged);

  // Files copied on the remote PC: offered in a bar at the bottom, fetched over
  // the RDP clipboard channel and saved by the app to the device's Downloads.
  const downloadsElement = document.getElementById('downloads');
  const fileTransfer = new RdpFileTransferProvider();
  const fileRows = new Map();
  const formatSize = (bytes) => {
    if (!bytes) return '';
    const units = ['B', 'KB', 'MB', 'GB'];
    let value = bytes;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) {
      value /= 1024;
      unit += 1;
    }
    return `${value.toFixed(unit ? 1 : 0)} ${units[unit]}`;
  };
  const saveToDevice = async (name, blob) => {
    const response = await fetch(
      `/download?t=${encodeURIComponent(sessionToken)}&name=${encodeURIComponent(name)}`,
      { method: 'POST', body: blob, headers: { 'Content-Type': 'application/octet-stream' } }
    );
    const text = await response.text();
    if (!response.ok) throw new Error(text || `HTTP ${response.status}`);
    return JSON.parse(text).savedAs;
  };
  const downloadFile = async (file, index, row) => {
    row.button.disabled = true;
    row.state.textContent = 'Downloading…';
    try {
      const { transferId, completion } = fileTransfer.downloadFile(file, index);
      fileRows.set(transferId, row);
      const blob = await completion;
      row.state.textContent = 'Saving…';
      const savedAs = await saveToDevice(file.name, blob);
      // Short status in the row; the app's toast names the saved location.
      row.state.textContent = 'Saved ✓';
      row.state.title = savedAs;
      row.button.textContent = 'Again';
      row.button.disabled = false;
      notifyNative('file_saved', savedAs);
    } catch (error) {
      row.state.textContent = 'Failed';
      row.state.title = String(error?.message || error);
      row.button.disabled = false;
    }
  };
  const showFiles = (files) => {
    // The bar always shows the latest files copied on the PC.
    fileRows.clear();
    downloadsElement.replaceChildren();
    const entries = files
      .map((file, index) => ({ file, index }))
      .filter(({ file }) => !file.isDirectory);
    if (!entries.length) {
      downloadsElement.hidden = true;
      return;
    }
    const header = document.createElement('header');
    const title = document.createElement('span');
    title.textContent = entries.length === 1
      ? 'File copied on the remote PC'
      : `${entries.length} files copied on the remote PC`;
    const all = document.createElement('button');
    all.textContent = 'Download all';
    const close = document.createElement('button');
    close.className = 'plain';
    close.textContent = '✕';
    close.addEventListener('click', () => { downloadsElement.hidden = true; });
    header.append(title);
    if (entries.length > 1) header.append(all);
    header.append(close);
    downloadsElement.append(header);
    const rows = entries.slice(0, 20).map(({ file, index }) => {
      const element = document.createElement('div');
      element.className = 'row';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = file.path ? `${file.path}\\${file.name}` : file.name;
      const state = document.createElement('span');
      state.className = 'state';
      state.textContent = formatSize(file.size);
      const button = document.createElement('button');
      button.textContent = 'Download';
      const row = { state, button };
      button.addEventListener('click', () => downloadFile(file, index, row));
      element.append(name, state, button);
      downloadsElement.append(element);
      return { file, index, row };
    });
    all.addEventListener('click', async () => {
      all.disabled = true;
      for (const { file, index, row } of rows) {
        if (!row.button.disabled) await downloadFile(file, index, row);
      }
    });
    downloadsElement.hidden = false;
  };
  fileTransfer.on('files-available', showFiles);
  // Other clipboard content replaced the copied files: they are gone.
  window.addEventListener('yourworkspace-clipboard-replaced', () => {
    downloadsElement.hidden = true;
  });
  fileTransfer.on('download-progress', (progress) => {
    const row = fileRows.get(progress.transferId);
    if (row) row.state.textContent = `${Math.round(progress.percentage)}%`;
  });
  // Device files the app picked (⇪): read from the app's gateway, then put on
  // the remote clipboard. Windows reads them when they are pasted (Ctrl+V);
  // the bar shows both phases with progress bars.
  const uploadsElement = document.getElementById('uploads');
  let upload = null;
  let uploadHideTimer = 0;
  // Warnings the IronRDP clipboard code logs (e.g. the server does not allow
  // file copy), shown when an upload fails or never starts.
  let lastClipboardWarning = '';
  // Logged once when the session starts: the PC does not take files.
  let clipboardCapabilityWarning = '';
  // Recent clipboard lines from IronRDP, shown by the upload bar's Log button.
  const clipboardLog = [];
  for (const level of ['log', 'info', 'debug', 'warn', 'error']) {
    const original = console[level].bind(console);
    console[level] = (...args) => {
      const text = args.map(String).join(' ');
      if (level === 'warn' || level === 'error'
          || /cliprdr|clipboard|file|format ?list|FormatData|lock|upload|disconnect|terminat|panic/i.test(text)) {
        clipboardLog.push(`${new Date().toISOString().slice(11, 19)} ${text
          .replace(/%c/g, '').replace(/\s+/g, ' ').replace(/^\S+Z /, '').slice(0, 300)}`);
        if (clipboardLog.length > 120) clipboardLog.shift();
      }
      if (level !== 'warn' && level !== 'error') {
        original(...args);
        return;
      }
      if (/not negotiated/i.test(text)) clipboardCapabilityWarning = text.slice(0, 400);
      if (/FILECLIP|FileContents|FileGroupDescriptor|file copy|file list|format list|Cliprdr/i.test(text)) {
        lastClipboardWarning = text.replace(/\s+/g, ' ')
          .replace(/^\S+Z (ERROR|WARN) [\w:]+: /, '').slice(0, 400);
      }
      original(...args);
    };
  }
  const hideUploadsLater = (delay) => {
    window.clearTimeout(uploadHideTimer);
    uploadHideTimer = window.setTimeout(() => { uploadsElement.hidden = true; }, delay);
  };
  const setRow = (row, text, fraction) => {
    row.state.textContent = text;
    row.state.title = text;
    if (fraction != null) row.fill.style.width = `${Math.max(0, Math.min(1, fraction)) * 100}%`;
  };
  // IronRDP keeps an upload pending until Windows has read every file, and
  // refuses new uploads meanwhile. A new pick replaces a pending one.
  // IronRDP polls the phone clipboard and sends any change to the PC, which
  // would replace uploaded files there. It suspends that only while the file
  // list is being sent; hold it until Windows has read the files instead.
  // A real copy on the phone meanwhile ends the hold (the page keeps reading
  // the clipboard): the newest content wins, as with any copy.
  const clipboardHold = { suppress: null, resume: null, held: false, timer: 0, poll: 0 };
  const holdClipboard = () => {
    if (!clipboardHold.suppress) return;
    clipboardHold.suppress();
    clipboardHold.held = true;
    window.clearTimeout(clipboardHold.timer);
    clipboardHold.timer = window.setTimeout(releaseClipboard, 10 * 60 * 1000);
    window.clearInterval(clipboardHold.poll);
    clipboardHold.poll = window.setInterval(() => {
      if (document.hasFocus()) navigator.clipboard.readText().catch(() => {});
    }, 300);
    console.info('clipboard: sync from the phone paused until the files are pasted');
  };
  const releaseClipboard = () => {
    window.clearTimeout(clipboardHold.timer);
    window.clearInterval(clipboardHold.poll);
    if (!clipboardHold.held) return;
    clipboardHold.held = false;
    clipboardHold.resume?.();
    console.info('clipboard: sync from the phone resumed');
  };
  const abandonPendingUpload = () => {
    const state = fileTransfer.uploadState;
    if (state === undefined) return;
    for (const timer of state.readerTimeouts?.values?.() || []) clearTimeout(timer);
    for (const reader of state.activeReaders?.values?.() || []) {
      try { reader.abort(); } catch (error) { /* already done */ }
    }
    fileTransfer.uploadState = undefined;
    fileTransfer.retainedFiles = undefined;
    try { state.resolve?.(); } catch (error) { /* ignore */ }
    releaseClipboard();
  };
  const updateUploadTitle = () => {
    if (!upload) return;
    const { rows } = upload;
    const done = rows.filter((row) => row.done).length;
    const failed = rows.filter((row) => row.failed).length;
    if (upload.phase === 'reading') {
      const total = rows.reduce((sum, row) => sum + (row.size || 0), 0);
      const read = rows.reduce((sum, row) => sum + (row.read || 0), 0);
      upload.title.textContent = total
        ? `Reading from phone… ${Math.round((read / total) * 100)}%`
        : 'Reading from phone…';
      return;
    }
    if (done + failed < rows.length) {
      const total = rows.reduce((sum, row) => sum + (row.size || 0), 0);
      const sent = rows.reduce((sum, row) => sum + (row.sent || 0), 0);
      upload.title.textContent = sent
        ? `Uploading to the PC… ${total ? Math.round((sent / total) * 100) : 0}%`
        : (rows.length === 1
          ? 'Ready: paste it in a Windows folder (Ctrl+V)'
          : `${rows.length} files ready: paste them in a Windows folder (Ctrl+V)`);
      return;
    }
    upload.paste.hidden = true;
    releaseClipboard();
    if (failed) {
      upload.title.textContent = failed === rows.length
        ? 'Upload failed'
        : `Uploaded ${done} of ${rows.length}, ${failed} failed`;
      return;
    }
    upload.title.textContent = rows.length === 1 ? 'Upload complete ✓' : `${rows.length} files uploaded ✓`;
    hideUploadsLater(3000);
  };
  const failRow = (row, message) => {
    row.failed = true;
    row.done = false;
    row.element.classList.add('failed');
    setRow(row, `Failed: ${message}`, null);
    row.state.title = message;
  };
  window.__rdpUploadFromApp = async (items) => {
    window.clearTimeout(uploadHideTimer);
    abandonPendingUpload();
    lastClipboardWarning = '';
    uploadsElement.replaceChildren();
    const header = document.createElement('header');
    const title = document.createElement('span');
    const paste = document.createElement('button');
    paste.textContent = 'Paste';
    paste.title = 'Send Ctrl+V to Windows';
    paste.hidden = true;
    paste.addEventListener('click', () => ui?.ctrlV?.());
    const close = document.createElement('button');
    close.className = 'plain';
    close.textContent = '✕';
    close.addEventListener('click', () => {
      window.clearTimeout(uploadHideTimer);
      uploadsElement.hidden = true;
      releaseClipboard();
    });
    const logButton = document.createElement('button');
    logButton.className = 'plain small';
    logButton.textContent = 'Log';
    const logView = document.createElement('pre');
    logView.className = 'log';
    logView.hidden = true;
    logButton.addEventListener('click', () => {
      logView.hidden = !logView.hidden;
      logView.textContent = clipboardLog.join('\n') || '(no clipboard messages)';
      window.clearTimeout(uploadHideTimer);
    });
    header.append(title, paste, logButton, close);
    uploadsElement.append(header, logView);
    const rows = items.map((item) => {
      const element = document.createElement('div');
      element.className = 'item';
      const line = document.createElement('div');
      line.className = 'row';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      const state = document.createElement('span');
      state.className = 'state';
      line.append(name, state);
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('i');
      bar.append(fill);
      element.append(line, bar);
      uploadsElement.append(element);
      const row = { element, state, fill, size: item.size > 0 ? item.size : 0, read: 0, sent: 0 };
      setRow(row, formatSize(item.size) || 'Waiting', 0);
      return row;
    });
    upload = { rows, title, paste, phase: 'reading', byTransferId: new Map(), byFile: new Map() };
    const current = upload;
    uploadsElement.hidden = false;
    updateUploadTitle();

    const files = [];
    const pickedRows = [];
    for (let index = 0; index < items.length; index += 1) {
      const item = items[index];
      const row = rows[index];
      try {
        const response = await fetch(
          `/upload?t=${encodeURIComponent(sessionToken)}&id=${encodeURIComponent(item.id)}`
        );
        if (!response.ok) {
          throw new Error(response.status === 404 ? 'expired, pick the file again' : `HTTP ${response.status}`);
        }
        const length = Number(response.headers.get('Content-Length')) || row.size;
        row.size = length;
        const chunks = [];
        const reader = response.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          row.read += value.length;
          setRow(row, length ? `Reading ${Math.round((row.read / length) * 100)}%` : `Reading ${formatSize(row.read)}`,
            length ? (row.read / length) * 0.3 : null);
          if (current === upload) updateUploadTitle();
        }
        if (length && row.read < length) throw new Error('the file could not be read completely');
        row.size = row.read;
        const file = new File(chunks, item.name, { lastModified: Date.now() });
        files.push(file);
        pickedRows.push(row);
        current.byFile.set(file, row);
        setRow(row, `${formatSize(file.size) || '0 B'} · waiting for paste`, 0.3);
      } catch (error) {
        failRow(row, String(error?.message || error).slice(0, 80));
      }
    }
    if (current !== upload) return;
    current.phase = 'clipboard';
    if (!files.length) {
      updateUploadTitle();
      return;
    }
    try {
      const { transferIds, completion } = fileTransfer.uploadFiles(files);
      holdClipboard();
      for (const [fileIndex, transferId] of transferIds || []) {
        current.byTransferId.set(transferId, pickedRows[fileIndex]);
      }
      completion?.catch((error) => {
        if (current !== upload) return;
        for (const row of pickedRows) {
          if (!row.done && !row.failed) failRow(row, String(error?.message || error).slice(0, 80));
        }
        updateUploadTitle();
      });
    } catch (error) {
      clipboardHold.resume?.();
      const reason = lastClipboardWarning || String(error?.message || error);
      for (const row of pickedRows) failRow(row, reason.slice(0, 120));
      current.title.textContent = 'Could not put the files on the remote clipboard';
      return;
    }
    // IronRDP only logs a refused file list (the call itself succeeds).
    if (!lastClipboardWarning && /FILECLIP_ENABLED not negotiated/i.test(clipboardCapabilityWarning)) {
      lastClipboardWarning = clipboardCapabilityWarning;
    }
    const refused = () => /Initiate file copy failed|FILECLIP_ENABLED not negotiated|rejected our format list/i.test(lastClipboardWarning);
    const failRefused = () => {
      abandonPendingUpload();
      const reason = /not in Ready state/i.test(lastClipboardWarning)
        ? 'the PC\'s clipboard is not available (clipboard redirection off, or still starting)'
        : /not negotiated/i.test(lastClipboardWarning)
          ? 'the PC does not allow file copy over the clipboard'
          : /rejected our format list/i.test(lastClipboardWarning)
            ? 'the PC rejected the file list'
          : lastClipboardWarning;
      for (const row of pickedRows) failRow(row, reason);
      current.paste.hidden = true;
      current.title.textContent = 'Upload failed: try again';
      current.title.title = lastClipboardWarning;
    };
    if (refused()) {
      failRefused();
      return;
    }
    current.paste.hidden = false;
    updateUploadTitle();
    for (const delay of [500, 2000, 5000]) {
      window.setTimeout(() => {
        if (current === upload && refused() && !pickedRows.some((row) => row.sent)) failRefused();
      }, delay);
    }
  };
  // The clipboard changed (copied on the phone, or on the PC) before Windows
  // read the files: the PC's clipboard no longer holds them.
  window.addEventListener('yourworkspace-clipboard-replaced', () => {
    if (!upload || upload.phase !== 'clipboard') return;
    const waiting = upload.rows.filter((row) => !row.done && !row.failed && !row.sent);
    if (!waiting.length) return;
    for (const row of waiting) failRow(row, 'replaced by a newer copy; upload again to paste it');
    upload.paste.hidden = true;
    upload.title.textContent = 'Replaced by what you copied';
    abandonPendingUpload();
  });
  fileTransfer.on('upload-progress', (progress) => {
    const row = upload?.byTransferId.get(progress.transferId);
    if (!row) return;
    // A re-paste starts over.
    if (row.done && progress.bytesTransferred < progress.totalBytes) row.done = false;
    row.sent = progress.bytesTransferred;
    setRow(row, `Uploading ${Math.round(progress.percentage)}%`, 0.3 + (progress.percentage / 100) * 0.7);
    if (uploadsElement.hidden) {
      window.clearTimeout(uploadHideTimer);
      uploadsElement.hidden = false;
    }
    updateUploadTitle();
  });
  fileTransfer.on('upload-complete', (file) => {
    const row = upload?.byFile.get(file);
    if (!row) return;
    row.done = true;
    row.sent = row.size;
    setRow(row, 'Done ✓', 1);
    updateUploadTitle();
  });
  fileTransfer.on('error', (error) => {
    console.warn('file transfer:', error.message);
    if (error.transferId == null) return;
    const uploadRow = upload?.byTransferId.get(error.transferId);
    if (uploadRow) {
      failRow(uploadRow, String(error.message).slice(0, 80));
      updateUploadTitle();
      return;
    }
    const downloadRow = fileRows.get(error.transferId);
    if (downloadRow) downloadRow.state.textContent = 'Failed';
  });

  element.addEventListener('ready', (event) => {
    ui = event.detail.irgUserInteraction;
    ui.setEnableClipboard(true);
    ui.setEnableAutoClipboard(true);
    ui.enableFileTransfer(fileTransfer);
    // enableFileTransfer wires these to pause/resume clipboard monitoring
    // around sending the file list; the page holds the pause itself.
    // Log what Windows asks for, to show in the upload bar's Log.
    const serveRequest = fileTransfer.handleFileContentsRequest?.bind(fileTransfer);
    if (serveRequest) {
      let logged = 0;
      fileTransfer.handleFileContentsRequest = (request) => {
        if (logged < 20) {
          logged += 1;
          console.info(`upload: PC requests file ${request.index} flags=${request.flags} `
            + `position=${request.position} size=${request.size}`);
        }
        return serveRequest(request);
      };
    }
    clipboardHold.suppress = fileTransfer.onUploadStarted;
    clipboardHold.resume = fileTransfer.onUploadFinished;
    fileTransfer.onUploadFinished = () => {};
    // Characters without a physical key (Chinese, ...) are sent as Unicode;
    // the app's keyboard bridge switches this on for just those characters.
    window.__rdpKeyboardUnicodeMode = (enabled) => ui.setKeyboardUnicodeMode(Boolean(enabled));
    // The component sets up its clipboard handlers right after this event;
    // connecting synchronously would build the session without them.
    window.setTimeout(connect, 100);
  });
  document.body.appendChild(element);
  window.__rdpReconnect = () => {
    attempts = 0;
    connect();
  };
</script>
</body>
</html>
